<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UIPKGE</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Angular 20 SaaS boilerplate — auth, database, billing, email, analytics, and observability baked in.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap">
  <!-- Theme anti-FOUC: reads the `uipkge-theme` cookie (NOT localStorage, so SSR
       and the client agree) and lands the dark class before first paint. Same
       logic as nuxt-boilerplate/server/plugins/theme.ts. Also lands the
       `uipkge-color-theme` / `uipkge-radius` cookies (see ColorThemeService).
       If you rename a key, change it here AND in the theme services. -->
  <script>try{var m=document.cookie.match(/(?:^|; )uipkge-theme=([^;]+)/);var t=m?decodeURIComponent(m[1]):"system";var d=t==="dark"||(t==="system"&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(d)document.documentElement.classList.add("dark");var cm=document.cookie.match(/(?:^|; )uipkge-color-theme=([^;]+)/);var ct=cm?decodeURIComponent(cm[1]):"default";if(ct&&ct!=="default")document.documentElement.setAttribute("data-color-theme",ct);var rm=document.cookie.match(/(?:^|; )uipkge-radius=([^;]+)/);var r=rm?decodeURIComponent(rm[1]):"0.3";if(r)document.documentElement.style.setProperty("--radius",r+"rem");}catch(e){}</script>
</head>
<body class="bg-background text-foreground min-h-dvh font-sans antialiased">
  <app-root></app-root>
</body>
</html>
